services:
  - type: web
    name: slack-lite-server
    runtime: node
    rootDir: apps/server
    buildCommand: cd ../.. && npm ci && npm run build -w @slack-lite/shared && npm run build -w @slack-lite/server
    startCommand: node dist/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
